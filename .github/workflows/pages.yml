name: Pages

# Builds docs/demo (map, dashboard, report, GeoJSON) and publishes it to GitHub Pages.
# Requires Pages to be enabled once in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is done the deploy step fails with "Get Pages site failed".

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The asset script runs the haversine vs OSMnx comparison, which needs the
      # [roads] extra (osmnx + networkx). If Overpass is unreachable the script
      # falls back to a haversine-only chart instead of failing the deploy.
      - name: Install package with road-network extras
        run: pip install -e ".[roads]"

      - name: Cache OSM drive graph
        uses: actions/cache@v4
        with:
          path: data/cache
          key: osm-graph-${{ hashFiles('src/teselado/ingest/synthetic.py', 'src/teselado/simulation/distance.py') }}

      - name: Build demo assets
        run: python scripts/generate_portfolio_assets.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
